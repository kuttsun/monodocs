<!-- The viewBox crops the drawing to a 20px margin on every side: the geometry
     below is laid out in a 960x420 space, and the y offset trims the empty band
     that leaves at the top and bottom. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 960 352" width="960" height="352" role="img" aria-labelledby="bundle-title bundle-desc">
  <title id="bundle-title">monodocs turns a directory of Markdown and AsciiDoc files into a single HTML or PDF file</title>
  <desc id="bundle-desc">Source files nested in the docs directory — Markdown, AsciiDoc and an image — converge on one monodocs build command, which produces two artifacts: docs.html, whose sidebar follows the same hierarchy of pages, and docs.pdf. The image is embedded in whichever is produced.</desc>

  <!-- Light variant. The dark variant is the same drawing with a swapped palette:
       any change here must be mirrored in bundle-dark.svg, which differs from this
       file only in its colour values.

       Palette and idiom follow site/.vitepress/theme/style.css: ink on paper,
       hairlines, monospace for machine strings, and the binding red spent only on
       the output. Colours are presentation attributes rather than a stylesheet so
       the file survives being served as a bare image on GitHub. -->

  <!-- ── Sources ─────────────────────────────────────────────────────────────
       Drawn as a tree, not a flat list: the nesting is the point, because the
       hierarchy of pages is what becomes the sidebar in the artifact on the
       right. Markdown and AsciiDoc sit side by side at the same depth. The image
       is here to show that assets are pulled in too — it is not a page, so it
       has no sidebar entry, which is why the miniature has one row fewer. -->
  <g stroke="#dedcd4" stroke-width="1" fill="none">
    <path d="M24.5 100V298.5" />
    <path d="M24.5 118.5H34" />
    <path d="M24.5 148.5H34" />
    <path d="M24.5 238.5H34" />
    <path d="M24.5 298.5H34" />
    <path d="M54.5 159V208.5" />
    <path d="M54.5 178.5H64" />
    <path d="M54.5 208.5H64" />
    <path d="M54.5 249V268.5" />
    <path d="M54.5 268.5H64" />
    <path d="M54.5 309V328.5" />
    <path d="M54.5 328.5H64" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#4d545b">
    <text x="16" y="92.5" font-size="13.5" font-weight="600" fill="#16191c">docs/</text>
    <text x="40" y="122.5">index.md</text>
    <text x="40" y="152.5" fill="#16191c">guide/</text>
    <text x="70" y="182.5">install.md</text>
    <text x="70" y="212.5">config.adoc</text>
    <text x="40" y="242.5" fill="#16191c">notes/</text>
    <text x="70" y="272.5">faq.adoc</text>
    <text x="40" y="302.5" fill="#16191c">images/</text>
    <text x="70" y="332.5">logo.svg</text>
  </g>

  <!-- ── The fan ─────────────────────────────────────────────────────────────
       Every source runs into the same point. The curves hold their row's height
       until the halfway mark and only then turn, so the convergence reads as
       one gesture rather than nine separate arrows. -->
  <g stroke="#666d74" stroke-width="1" fill="none" opacity="0.55">
    <path d="M192 88C301 88 320 211 430 211" />
    <path d="M192 118C301 118 320 211 430 211" />
    <path d="M192 148C301 148 320 211 430 211" />
    <path d="M192 178C301 178 320 211 430 211" />
    <path d="M192 208C301 208 320 211 430 211" />
    <path d="M192 238C301 238 320 211 430 211" />
    <path d="M192 268C301 268 320 211 430 211" />
    <path d="M192 298C301 298 320 211 430 211" />
    <path d="M192 328C301 328 320 211 430 211" />
  </g>

  <!-- The command the whole picture is an illustration of. Kept ink-coloured:
       the accent belongs to the output, not to the tool. -->
  <g>
    <rect x="430.5" y="189.5" width="205" height="43" rx="2" fill="#ffffff" stroke="#dedcd4" />
    <text x="533" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#16191c">monodocs build ./docs</text>
  </g>

  <!-- One input, two possible artifacts. -->
  <g stroke="#666d74" stroke-width="1" fill="none" opacity="0.55">
    <path d="M636 211C662 211 662 146 686 146" />
    <path d="M636 211C662 211 662 313 686 313" />
  </g>
  <g fill="#666d74" opacity="0.55">
    <polygon points="690,146 681,141.5 681,150.5" />
    <polygon points="690,313 681,308.5 681,317.5" />
  </g>

  <!-- ── docs.html ───────────────────────────────────────────────────────────
       The miniature inside the card is the payoff: its sidebar repeats the
       shape of the tree on the left, with one entry marked in the accent as the
       page being read. -->
  <g>
    <rect x="690.5" y="54.5" width="253" height="183" rx="2" fill="#ffffff" stroke="#dedcd4" />
    <rect x="690.5" y="54.5" width="3" height="183" fill="#9e2a1f" />
    <text x="712" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="600" fill="#16191c">docs.html</text>
    <path d="M712 102.5H922" stroke="#dedcd4" stroke-width="1" fill="none" />
    <path d="M778.5 116V210" stroke="#dedcd4" stroke-width="1" fill="none" />

    <!-- One row per page in the tree — the six Markdown and AsciiDoc files, not
         the image — with the one being read marked in the accent. -->
    <g fill="#666d74" opacity="0.45">
      <rect x="712" y="118" width="44" height="5" rx="1" />
      <rect x="712" y="134" width="48" height="5" rx="1" />
      <rect x="722" y="166" width="34" height="5" rx="1" />
      <rect x="712" y="182" width="44" height="5" rx="1" />
      <rect x="722" y="198" width="30" height="5" rx="1" />
    </g>
    <rect x="722" y="150" width="38" height="5" rx="1" fill="#9e2a1f" />

    <rect x="792" y="118" width="88" height="9" rx="1" fill="#16191c" opacity="0.85" />
    <g fill="#666d74" opacity="0.35">
      <rect x="792" y="142" width="130" height="4" rx="1" />
      <rect x="792" y="154" width="122" height="4" rx="1" />
      <rect x="792" y="166" width="108" height="4" rx="1" />
      <rect x="792" y="178" width="130" height="4" rx="1" />
      <rect x="792" y="190" width="116" height="4" rx="1" />
      <rect x="792" y="202" width="74" height="4" rx="1" />
    </g>
  </g>

  <!-- ── docs.pdf ────────────────────────────────────────────────────────────
       The same tree again, this time as PDF bookmarks. The flag that produces
       it is printed next to the name so the card says how, not just what. -->
  <g>
    <rect x="690.5" y="260.5" width="253" height="105" rx="2" fill="#ffffff" stroke="#dedcd4" />
    <rect x="690.5" y="260.5" width="3" height="105" fill="#9e2a1f" />
    <text x="712" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="600" fill="#16191c">docs.pdf</text>
    <text x="922" y="294" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#666d74">--format pdf</text>
    <path d="M712 306.5H922" stroke="#dedcd4" stroke-width="1" fill="none" />
    <path d="M778.5 314V352" stroke="#dedcd4" stroke-width="1" fill="none" />

    <g fill="#666d74" opacity="0.45">
      <rect x="712" y="318" width="34" height="4" rx="1" />
      <rect x="722" y="330" width="26" height="4" rx="1" />
      <rect x="712" y="342" width="30" height="4" rx="1" />
    </g>

    <rect x="792" y="318" width="70" height="7" rx="1" fill="#16191c" opacity="0.85" />
    <g fill="#666d74" opacity="0.35">
      <rect x="792" y="336" width="130" height="4" rx="1" />
      <rect x="792" y="348" width="112" height="4" rx="1" />
    </g>
  </g>
</svg>
