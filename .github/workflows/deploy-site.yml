name: Deploy site

# Builds the VitePress site (including the monodocs-generated single-file demos)
# and publishes it to GitHub Pages.
#
# The build runs entirely inside the project's dev Docker image (Dockerfile.dev),
# reusing the same scripts used for local builds so CI and local produce the site
# the same way:
#   scripts/app.sh pnpm install   -> builds the monodocs-dev image and installs app deps
#   scripts/site-build.sh         -> CLI build -> single-file demos -> VitePress build
#
# Prerequisite (already configured): Settings -> Pages -> Source: GitHub Actions.
#
# The site is served from the project-pages subpath (https://<owner>.github.io/monodocs/),
# so the build sets SITE_BASE=/monodocs/ (see site/.vitepress/config.ts).
#
# The site documents the released package, so it is deployed from the latest stable release and
# never from main: a push to main would publish features no installable version has yet.
#
# - Automatically, after the Release workflow (release.yml) succeeds for a stable tag. Waiting
#   for it keeps the site from describing a version whose npm publish failed. A prerelease
#   run is skipped: it goes to the npm `next` dist-tag and must not replace the `latest` docs.
# - By hand, from main, with the tag of the latest stable release; any other tag is refused so
#   that a redeploy cannot roll the site back.
#
# Both run on main (workflow_run always uses the default branch), so the github-pages
# environment's `main` deployment rule covers them; the tag is only what gets checked out.
# A site-only fix on main therefore reaches the live site with the next release.
#
# The gate is the whole Release run, binaries included. If a job fails after npm publish
# succeeded, re-run the failed jobs of that Release run (its completion triggers this again)
# or redeploy by hand.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Latest stable release tag to redeploy (for example v0.13.0)
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site (Docker)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_branch, '-'))

    steps:
      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          # For a release-triggered Release run, head_branch is the release tag.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag like v0.13.0, got '$tag'" >&2
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$tag" != "$latest" ]; then
            echo "Only the release marked latest ($latest) is deployed, got '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      # First use of scripts/app.sh builds the monodocs-dev image from Dockerfile.dev.
      # site-build.sh assumes app dependencies are present, so install them here.
      - name: Build dev image and install app dependencies
        run: scripts/app.sh pnpm install

      # Builds the CLI, regenerates the single-file demos into site/public, and runs
      # the VitePress production build into site/.vitepress/dist — all inside Docker.
      - name: Build site in Docker
        run: SITE_BASE=/monodocs/ scripts/site-build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Allow one concurrent deployment; let an in-progress run finish rather than cancel it.
    # Set on the job so that runs whose build is skipped never join the group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
