name: Verify published package

# Manually verifies a PUBLISHED npm release of `monodocs` by installing it from
# the registry on real GitHub-hosted runners and running the CLI smoke suite.
# This complements PR CI (which smoke-tests the pre-publish tarball) by exercising
# the actual published artifact on Linux x64 and Windows x64 — the M4.2 beta
# verification step in docs/oss-npm-roadmap.md.
#
# Note: `serve` / `watch` (long-running) and the manual README reproduction are
# intentionally out of scope here and remain manual checks.

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag or exact version to verify (e.g. next, latest, 0.6.0-beta.1)
        default: next
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            chromium: /usr/bin/google-chrome
          - name: Windows
            os: windows-latest
            chromium: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
    env:
      PUPPETEER_EXECUTABLE_PATH: ${{ matrix.chromium }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install published monodocs@${{ inputs.dist_tag }}
        run: npm install --global "monodocs@${{ inputs.dist_tag }}"

      - name: Version and help
        run: |
          monodocs --version
          monodocs --help

      # The version decides which surface exists to be verified: this workflow takes any dist-tag or
      # version as input, and `init`, the message language, and PDF page numbers all arrive in 0.10,
      # the diagnostics JSON and `document` in 0.11, and `root` / `sources.include`, route aliases,
      # `sources.asciidoc.attributes`, and the include boundary in 0.12. Verifying an older release
      # must stay possible, so those steps ask rather than assume.
      - name: Record the published version
        run: |
          version="$(monodocs --version | tr -d '\r')"
          echo "verifying monodocs $version"
          # A version this cannot read fails the step rather than answering "false": that answer
          # would skip every check below and still report a green verification run.
          gate="$(node -e "
            const raw = process.argv[1].trim().replace(/^v/, '');
            const m = /^(\d+)\.(\d+)\.(\d+)/.exec(raw);
            if (!m) { console.error('cannot read a version out of: ' + JSON.stringify(process.argv[1])); process.exit(1); }
            const major = Number(m[1]), minor = Number(m[2]);
            const atLeast = (n) => major > 0 || minor >= n;
            process.stdout.write([atLeast(10), atLeast(11), atLeast(12)].map(String).join(' '));
          " "$version")"
          echo "MONODOCS_VERSION=$version" >> "$GITHUB_ENV"
          echo "SUPPORTS_V010=$(echo "$gate" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SUPPORTS_V011=$(echo "$gate" | cut -d' ' -f2)" >> "$GITHUB_ENV"
          echo "SUPPORTS_V012=$(echo "$gate" | cut -d' ' -f3)" >> "$GITHUB_ENV"

      - name: Validate
        run: monodocs validate examples/en

      - name: Build HTML
        run: |
          mkdir -p out
          monodocs build examples/en -o out/docs.html

      - name: Assert self-contained HTML
        run: |
          node -e "const h=require('node:fs').readFileSync('out/docs.html','utf8'); if(!h.includes('data-route')) throw new Error('no pages rendered'); if(/src=\"https?:\/\//.test(h)) throw new Error('external asset reference found');"

      - name: Build PDF
        run: monodocs build examples/en --format pdf -o out/docs.pdf

      - name: Assert PDF header
        run: |
          node -e "const m=require('node:fs').readFileSync('out/docs.pdf').subarray(0,5).toString('latin1'); if(m!=='%PDF-') throw new Error('invalid PDF header: '+m);"

      # End-to-end proof that the browser is discovered automatically (no
      # PUPPETEER_EXECUTABLE_PATH): the runner has Google Chrome at a standard
      # location, so a successful PDF here exercises the platform-aware
      # candidate search (Linux /usr/bin, Windows Program Files / Edge fallback).
      - name: Build PDF with browser auto-detection (no PUPPETEER_EXECUTABLE_PATH)
        run: |
          unset PUPPETEER_EXECUTABLE_PATH
          monodocs build examples/en --format pdf -o out/auto-detect.pdf
          node -e "const m=require('node:fs').readFileSync('out/auto-detect.pdf').subarray(0,5).toString('latin1'); if(m!=='%PDF-') throw new Error('auto-detection produced an invalid PDF header: '+m);"

      # Asserts the contract of `--format both` (one HTML and one PDF inside the
      # directory given to `-o`) rather than the file names, because this workflow
      # accepts any published version as input and the default output name changed
      # from `manual.*` to `docs.*` in 0.9.0.
      - name: Build both (HTML + PDF)
        run: |
          monodocs build examples/en --format both -o out/both
          node -e "const fs=require('node:fs'); const files=fs.readdirSync('out/both'); const html=files.filter(f=>f.endsWith('.html')); const pdf=files.filter(f=>f.endsWith('.pdf')); if(html.length!==1||pdf.length!==1) throw new Error('--format both did not create one HTML and one PDF, found: '+files.join(', ')); const m=fs.readFileSync('out/both/'+pdf[0]).subarray(0,5).toString('latin1'); if(m!=='%PDF-') throw new Error('invalid PDF header in both output: '+m);"

      - name: Mermaid pre-render
        run: |
          node -e "require('node:fs').writeFileSync('pre-render.yml','mermaid:\n  mode: pre-render\n');"
          monodocs build examples/en -c pre-render.yml -o out/pre-render.html
          node -e "const h=require('node:fs').readFileSync('out/pre-render.html','utf8'); if(!h.includes('<figure class=\"mermaid\"><svg')) throw new Error('Mermaid diagram was not pre-rendered to inline SVG');"

      # v0.10. The messages are asserted through files rather than through the shell, so the check
      # does not depend on the console code page of a Windows runner, and the Japanese is written as
      # escapes so that nothing non-ASCII has to survive being passed as a command-line argument.
      - name: Message language
        if: env.SUPPORTS_V010 == 'true'
        run: |
          monodocs --help > help-default.txt 2>&1
          monodocs --lang ja --help > help-flag.txt 2>&1
          MONODOCS_LANG=ja monodocs --help > help-env.txt 2>&1
          MONODOCS_LANG=ja monodocs --lang en --help > help-precedence.txt 2>&1
          if monodocs --lang fr --help > help-unsupported.txt 2>&1; then
            echo "--lang fr should have been rejected"; cat help-unsupported.txt; exit 1
          fi
          node -e "
            const fs = require('node:fs');
            const read = (f) => fs.readFileSync(f, 'utf8');
            const ja = '\u4f7f\u3044\u65b9:'; // 使い方:
            const fail = (m) => { throw new Error(m); };
            if (!read('help-default.txt').includes('Usage:')) fail('default help is not English');
            if (read('help-default.txt').includes(ja)) fail('default help carries Japanese');
            if (!read('help-flag.txt').includes(ja)) fail('--lang ja did not translate the help');
            if (!read('help-env.txt').includes(ja)) fail('MONODOCS_LANG=ja did not translate the help');
            if (!read('help-precedence.txt').includes('Usage:')) fail('--lang did not win over MONODOCS_LANG');
            const bad = read('help-unsupported.txt');
            if (!bad.includes('en, ja')) fail('an unsupported --lang did not name the supported ones: ' + bad);
          "

      # v0.10. What `init` writes has to build unedited — that is the whole claim — so the scaffold
      # is built rather than merely inspected, and the second run has to refuse rather than overwrite.
      - name: Init scaffold
        if: env.SUPPORTS_V010 == 'true'
        run: |
          mkdir -p scaffold
          cd scaffold
          monodocs init
          monodocs build
          node -e "
            const fs = require('node:fs');
            for (const f of ['monodocs.config.yml', 'docs/index.md', 'dist/docs.html']) {
              if (!fs.existsSync(f)) throw new Error('init scaffold did not produce ' + f);
            }
            const html = fs.readFileSync('dist/docs.html', 'utf8');
            if (!html.includes('data-route')) throw new Error('the scaffold built no pages');
          "
          if monodocs init > second-init.txt 2>&1; then
            echo "a second init should have refused"; exit 1
          fi
          node -e "
            const found = require('node:fs').readFileSync('second-init.txt', 'utf8');
            if (!found.includes('monodocs.config.yml')) throw new Error('init did not name what it found: ' + found);
          "
          cd ..
          mkdir -p scaffold-ja
          cd scaffold-ja
          monodocs --lang ja init
          node -e "
            const config = require('node:fs').readFileSync('monodocs.config.yml', 'utf8');
            if (!config.includes('lang: \"ja\"')) throw new Error('the Japanese scaffold does not declare lang: ja');
          "

      # v0.10. A PDF that exists is not a PDF with page numbers on it, which is all this workflow
      # used to establish. The fixture carries no digits of its own — branding included, since it
      # prints the CLI version — so every digit read back off a page came from the band.
      - name: PDF page numbers
        if: env.SUPPORTS_V010 == 'true'
        run: |
          npm install --no-save --no-package-lock pdf-lib
          node -e "
            const fs = require('node:fs');
            fs.mkdirSync('pagenum/docs', { recursive: true });
            const filler = Array.from({ length: 120 }, () => 'Filler paragraph of text, no numerals here.').join('\n\n');
            fs.writeFileSync('pagenum/docs/index.md', '# Home\n\n' + filler + '\n');
            fs.writeFileSync('pagenum/docs/guide.md', '# Guide\n\n' + filler + '\n');
            fs.writeFileSync('pagenum/on.yml', 'html:\n  branding: false\n');
            fs.writeFileSync('pagenum/off.yml', 'html:\n  branding: false\npdf:\n  footer: false\n');
          "
          monodocs build pagenum/docs -c pagenum/on.yml --format pdf -o pagenum/numbered.pdf
          monodocs build pagenum/docs -c pagenum/off.yml --format pdf -o pagenum/plain.pdf
          node scripts/assert-pdf-page-numbers.mjs pagenum/numbered.pdf --expect numbered
          node scripts/assert-pdf-page-numbers.mjs pagenum/plain.pdf --expect none

      # v0.10. The build now measures the fonts it needs against the ones this machine has. An
      # unassigned codepoint is used rather than a real script: no font anywhere can cover it, so
      # the assertion does not depend on what the runner happens to have installed.
      - name: Font check
        if: env.SUPPORTS_V010 == 'true'
        run: |
          node -e "
            const fs = require('node:fs');
            fs.mkdirSync('fontcheck/docs', { recursive: true });
            fs.writeFileSync('fontcheck/docs/index.md', '# Home\n\nUnassigned: \u{50000}\n');
          "
          monodocs build fontcheck/docs --format pdf -o fontcheck/out.pdf > fontcheck/log.txt 2>&1
          cat fontcheck/log.txt
          node -e "
            const log = require('node:fs').readFileSync('fontcheck/log.txt', 'utf8');
            if (!log.includes('U+50000')) throw new Error('the font check did not report the undrawable character');
          "

      # v0.11. A report a CI job can read is only worth having if it is the whole of stdout, so the
      # stream is parsed rather than searched: anything printed beside the JSON fails `JSON.parse`.
      # The finding is asserted by code, path, and line — the parts 12.4 promises to hold still —
      # rather than by the sentence, which is translated and rewritten.
      - name: Diagnostics JSON
        if: env.SUPPORTS_V011 == 'true'
        run: |
          node -e "
            const fs = require('node:fs');
            fs.mkdirSync('diagnostics/docs', { recursive: true });
            fs.writeFileSync('diagnostics/docs/index.md', '# Home\n\nA line.\n\nA [broken link](nope.md) here.\n');
          "
          # An unresolved link is a warning, so the command succeeds: the exit code follows the
          # severity, and a warning is a gate only under `--strict`.
          monodocs validate diagnostics/docs --format json > diagnostics/report.json
          cat diagnostics/report.json
          node -e "
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('diagnostics/report.json', 'utf8'));
            if (report.schemaVersion !== 1) throw new Error('unexpected schema version: ' + report.schemaVersion);
            const link = report.diagnostics.find((d) => d.code === 'link/unresolved');
            if (!link) throw new Error('the unresolved link is not in the report: ' + JSON.stringify(report));
            if (link.severity !== 'warning') throw new Error('unexpected severity: ' + link.severity);
            if (link.path !== 'index.md' || link.line !== 5) throw new Error('the finding lost its position: ' + JSON.stringify(link));
          "
          # The human report is prose, not JSON, and the same document under `--strict` fails.
          monodocs validate diagnostics/docs > diagnostics/human.txt 2>&1
          node -e "
            const human = require('node:fs').readFileSync('diagnostics/human.txt', 'utf8');
            if (human.trimStart().startsWith('{')) throw new Error('the default report is JSON: ' + human);
            if (!human.includes('nope.md')) throw new Error('the default report does not name the finding: ' + human);
          "
          if monodocs validate diagnostics/docs --strict > diagnostics/strict.txt 2>&1; then
            echo "--strict should have failed a document with a warning"; cat diagnostics/strict.txt; exit 1
          fi
          # An error fails the command with or without the flag. A path that is not there is one.
          if monodocs validate diagnostics/does-not-exist > diagnostics/error.txt 2>&1; then
            echo "a missing input should have failed"; cat diagnostics/error.txt; exit 1
          fi
          # A clean document is still one JSON object, and still exits zero: a stream that is
          # sometimes JSON and sometimes nothing is not a format either.
          node -e "
            const fs = require('node:fs');
            fs.mkdirSync('diagnostics/clean', { recursive: true });
            fs.writeFileSync('diagnostics/clean/index.md', '# Home\n\nNothing wrong here.\n');
          "
          monodocs validate diagnostics/clean --format json > diagnostics/clean.json
          node -e "
            const report = JSON.parse(require('node:fs').readFileSync('diagnostics/clean.json', 'utf8'));
            if (report.schemaVersion !== 1) throw new Error('unexpected schema version: ' + report.schemaVersion);
            if (!Array.isArray(report.diagnostics) || report.diagnostics.length !== 0) {
              throw new Error('a clean document reported something: ' + JSON.stringify(report));
            }
          "
          if monodocs validate diagnostics/docs --format yaml > diagnostics/bad-format.txt 2>&1; then
            echo "an unknown report format should have been rejected"; exit 1
          fi
          node -e "
            const out = require('node:fs').readFileSync('diagnostics/bad-format.txt', 'utf8');
            if (!out.includes('human | json')) throw new Error('the refusal does not name the formats that work: ' + out);
          "

      # v0.11. What a document says about itself has to survive being packaged and delivered: the
      # footer is read out of the HTML, and the PDF's properties out of the bytes, since the two are
      # written by different halves of the pipeline.
      - name: Document metadata
        if: env.SUPPORTS_V011 == 'true'
        run: |
          npm install --no-save --no-package-lock pdf-lib
          node -e "
            const fs = require('node:fs');
            fs.mkdirSync('docmeta/docs', { recursive: true });
            fs.writeFileSync('docmeta/docs/index.md', '# Home\n\nA line.\n');
            fs.writeFileSync('docmeta/config.yml', 'title: \"Spec\"\ndocument:\n  version: \"1.2\"\n  date: \"2026-08-22\"\n  authors:\n    - \"Docs Team\"\n');
          "
          monodocs build docmeta/docs -c docmeta/config.yml -o docmeta/docs.html
          monodocs build docmeta/docs -c docmeta/config.yml --format pdf -o docmeta/docs.pdf
          node -e "
            const html = require('node:fs').readFileSync('docmeta/docs.html', 'utf8');
            if (!html.includes('Version 1.2')) throw new Error('the footer does not carry the version');
            if (!html.includes('2026-08-22') || !html.includes('Docs Team')) throw new Error('the footer does not carry the date and authors');
          "
          node -e "
            const fs = require('node:fs');
            const { PDFDocument } = require('pdf-lib');
            // updateMetadata: false, or pdf-lib rewrites the fields being read.
            PDFDocument.load(fs.readFileSync('docmeta/docs.pdf'), { updateMetadata: false })
              .then((doc) => {
                const fail = (m) => { throw new Error(m); };
                if (doc.getTitle() !== 'Spec') fail('unexpected PDF title: ' + doc.getTitle());
                if (doc.getAuthor() !== 'Docs Team') fail('unexpected PDF author: ' + doc.getAuthor());
                if (!String(doc.getSubject()).includes('1.2')) fail('unexpected PDF subject: ' + doc.getSubject());
                if (!String(doc.getKeywords()).includes('2026-08-22')) fail('unexpected PDF keywords: ' + doc.getKeywords());
              })
              // An unhandled rejection would fail the step with a stack; one line says what broke.
              .catch((error) => { console.error(String(error && error.message ? error.message : error)); process.exit(1); });
          "

      # v0.11. Two builds of one input produce one artifact: the footer carries the date the author
      # wrote and never the moment the build ran (13.5). Asserted on the HTML, which is what a
      # repository commits and reviews in a diff — the PDF carries Chromium's own timestamps.
      - name: Reproducible HTML
        if: env.SUPPORTS_V011 == 'true'
        run: |
          monodocs build docmeta/docs -c docmeta/config.yml -o docmeta/first.html
          monodocs build docmeta/docs -c docmeta/config.yml -o docmeta/second.html
          node -e "
            const fs = require('node:fs');
            const a = fs.readFileSync('docmeta/first.html');
            const b = fs.readFileSync('docmeta/second.html');
            if (!a.equals(b)) throw new Error('the same input produced different bytes');
          "

      # v0.12. A repository shaped the way repositories are shaped — a readme at the top and pages
      # one directory down — builds as one document, with routes taken relative to `root` (12.5).
      - name: Input root and sources.include
        if: env.SUPPORTS_V012 == 'true'
        run: |
          mkdir -p inputroot/docs
          printf '= Readme\n\nThe top of the repository.\n' > inputroot/README.adoc
          printf '= Docs\n\nThe documentation index.\n' > inputroot/docs/index.adoc
          printf '= Draft\n\nNot for readers.\n' > inputroot/docs/draft.adoc
          printf 'root: "."\nsources:\n  include:\n    - "README.adoc"\n    - "docs/**"\n  exclude:\n    - "docs/draft.adoc"\n' > inputroot/monodocs.config.yml
          monodocs build -c inputroot/monodocs.config.yml -o inputroot/out.html
          node -e "
            const h = require('node:fs').readFileSync('inputroot/out.html', 'utf8');
            if (!h.includes('The top of the repository.')) throw new Error('the readme at the root was not bundled');
            if (!h.includes('data-route=\"/docs\"')) throw new Error('routes are not relative to root');
            if (h.includes('Not for readers.')) throw new Error('exclude did not subtract last');
          "

      # v0.12. A negated pattern is refused rather than misread, because picomatch combines an array
      # with OR and one would match almost every path (12.5).
      - name: Negated glob refused
        if: env.SUPPORTS_V012 == 'true'
        shell: bash
        run: |
          printf 'sources:\n  include:\n    - "!docs/**"\n' > inputroot/negated.yml
          if monodocs build -c inputroot/negated.yml -o inputroot/negated.html 2> inputroot/negated.log; then
            echo "a negated pattern was accepted"; cat inputroot/negated.log; exit 1
          fi
          grep -q "negated pattern" inputroot/negated.log || { echo "the error did not name the problem"; cat inputroot/negated.log; exit 1; }

      # v0.12. An old hash route still reaches the page, and the table reaches the client (15.5).
      - name: Route aliases
        if: env.SUPPORTS_V012 == 'true'
        run: |
          mkdir -p aliases/guide
          printf '= Home\n\nHome page.\n' > aliases/index.adoc
          printf '= Installation\n:sd-aliases: /setup/install, /getting-started/install\n\nInstall me.\n' > aliases/guide/install.adoc
          monodocs build aliases -o aliases/out.html
          node -e "
            const h = require('node:fs').readFileSync('aliases/out.html', 'utf8');
            const m = h.match(/window\.__MONODOCS_DATA__\s*=\s*(\{[\s\S]*?\});/);
            if (!m) throw new Error('no site data in the output');
            const aliases = JSON.parse(m[1]).aliases || {};
            if (aliases['/setup/install'] !== '/guide/install') throw new Error('alias missing: ' + JSON.stringify(aliases));
            if (aliases['/getting-started/install'] !== '/guide/install') throw new Error('second alias missing');
            if (h.includes('data-route=\"/setup/install\"')) throw new Error('an alias became a page');
          "

      # v0.12. A configured attribute is a default the document can override, and one that moves the
      # read boundary is refused naming it (17.5).
      - name: AsciiDoc attributes
        if: env.SUPPORTS_V012 == 'true'
        shell: bash
        run: |
          mkdir -p adocattrs/docs
          printf '= A\n\nShipping {product}.\n' > adocattrs/docs/a.adoc
          printf '= B\n:product: Gadget\n\nShipping {product}.\n' > adocattrs/docs/b.adoc
          printf 'input: ./docs\nsources:\n  asciidoc:\n    attributes:\n      product: "Widget"\n' > adocattrs/config.yml
          monodocs build adocattrs/docs -c adocattrs/config.yml -o adocattrs/out.html
          node -e "
            const h = require('node:fs').readFileSync('adocattrs/out.html', 'utf8');
            if (!h.includes('Shipping Widget.')) throw new Error('the configured attribute was not applied');
            if (!h.includes('Shipping Gadget.')) throw new Error('the document did not win over the configuration');
          "
          printf 'input: ./docs\nsources:\n  asciidoc:\n    attributes:\n      allow-uri-read: true\n' > adocattrs/refused.yml
          if monodocs build adocattrs/docs -c adocattrs/refused.yml -o adocattrs/refused.html 2> adocattrs/refused.log; then
            echo "allow-uri-read was accepted"; cat adocattrs/refused.log; exit 1
          fi
          grep -q "allow-uri-read" adocattrs/refused.log || { echo "the error did not name the attribute"; cat adocattrs/refused.log; exit 1; }
          printf 'input: ./docs\nsources:\n  asciidoc:\n    attributes:\n      "allow-uri-read@": true\n' > adocattrs/decorated.yml
          if monodocs build adocattrs/docs -c adocattrs/decorated.yml -o adocattrs/decorated.html 2> adocattrs/decorated.log; then
            echo "a decorated attribute name walked past the classification"; cat adocattrs/decorated.log; exit 1
          fi

      # v0.12. Safe mode does not resolve symbolic links, so an include reaching outside the input
      # root through one is refused naming the path it resolved to (17.5). Linux only: creating a
      # symbolic link on a Windows runner needs privileges this job does not have.
      - name: Include read boundary
        if: env.SUPPORTS_V012 == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p boundary/root boundary/outside
          printf 'SECRET-FROM-OUTSIDE\n' > boundary/outside/secret.adoc
          ln -s ../outside/secret.adoc boundary/root/linked.adoc
          printf '= A\n\ninclude::linked.adoc[]\n' > boundary/root/a.adoc
          if monodocs build boundary/root -o boundary/out.html 2> boundary/log; then
            echo "an include reaching outside the root was allowed"; cat boundary/log
            grep -q "SECRET-FROM-OUTSIDE" boundary/out.html && echo "and the outside content is in the output"
            exit 1
          fi
          grep -q "outside the input root" boundary/log || { echo "the error did not say what was wrong"; cat boundary/log; exit 1; }
          grep -q "secret.adoc" boundary/log || { echo "the error did not name the path it resolved to"; cat boundary/log; exit 1; }
