name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    name: App CI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            chromium: /usr/bin/google-chrome
            vitest_workers: 4
          - name: Windows
            os: windows-latest
            chromium: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
            vitest_workers: 1
    env:
      PUPPETEER_EXECUTABLE_PATH: ${{ matrix.chromium }}
      VITEST_MAX_WORKERS: ${{ matrix.vitest_workers }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit app dependencies
        run: pnpm audit

      - name: Run app checks
        run: pnpm ci:check

      - name: Verify third-party notices
        run: >-
          node -e "const fs = require('node:fs'); const text =
          fs.readFileSync('dist/THIRD-PARTY-NOTICES.txt', 'utf8'); const match =
          /Components: (\d+)/.exec(text); if (!match || Number(match[1]) < 1 ||
          text.includes('—  UNKNOWN')) throw new Error('Invalid third-party notices');"

      - name: Verify installable npm package
        run: pnpm package:verify

      - name: Smoke test application outputs
        run: |
          node dist/monodocs.cjs --version
          node dist/monodocs.cjs --help
          node dist/monodocs.cjs validate ../examples/en
          node dist/monodocs.cjs build ../examples/en -o dist/ci-smoke.html
          node -e "require('node:fs').writeFileSync('dist/ci-smoke-pre-render.yml', 'mermaid:\n  mode: pre-render\n')"
          node packages/cli/dist/index.js build ../examples/en -c dist/ci-smoke-pre-render.yml -o dist/ci-smoke-pre-render.html
          node -e "const html = require('node:fs').readFileSync('dist/ci-smoke-pre-render.html', 'utf8'); if (!html.includes('<svg')) throw new Error('Pre-rendered SVG not found');"
          node packages/cli/dist/index.js build ../examples/en --format pdf -o dist/ci-smoke.pdf
          node -e "const magic = require('node:fs').readFileSync('dist/ci-smoke.pdf').subarray(0, 5).toString('latin1'); if (magic !== '%PDF-') throw new Error('Invalid PDF header');"

      # リリースで配布する単一実行ファイルを PR 時点で検証する
      # （リリース時にしか動かさないと、失敗が公開作業中にしか分からないため）。
      - name: Build and smoke test the standalone binary
        shell: bash
        run: |
          pnpm build:bin
          bin="./dist/monodocs"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="./dist/monodocs.exe"; fi
          "$bin" --version
          "$bin" --help
          "$bin" validate ../examples/en
          "$bin" build ../examples/en -o dist/bin-smoke.html
          node -e "const html = require('node:fs').readFileSync('dist/bin-smoke.html', 'utf8'); if (!html.includes('__MONODOCS_DATA__')) throw new Error('Binary produced no document');"
          # 再配布に必要なライセンス通知（monodocs / Node.js / npm 依存）が揃っているか。
          node -e "const notices = require('node:fs').readFileSync('dist/monodocs-NOTICES.txt', 'utf8'); for (const needle of ['MIT License', 'Node.js runtime', 'Components:']) { if (!notices.includes(needle)) throw new Error('Binary notices missing: ' + needle); }"
          # PDF / Mermaid pre-render はブラウザ依存のためバンドル版では使えない。
          # 黙って壊れるのではなく、はっきり失敗することを確認する。
          if "$bin" build ../examples/en --format pdf -o dist/bin-smoke.pdf; then
            echo "Expected the standalone binary to reject PDF output" >&2
            exit 1
          fi

      - name: Generate site demos
        if: matrix.name == 'Linux'
        run: |
          node dist/monodocs.cjs build ../examples/en -o ../site/public/sample.html
          node dist/monodocs.cjs build ../examples/ja -o ../site/public/ja/sample.html

      - name: Upload site demos
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: site-demos
          path: |
            site/public/sample.html
            site/public/ja/sample.html
          if-no-files-found: error
          retention-days: 1

  # リリースバイナリの検証スクリプトは CI で実行されないため、静的解析だけは毎回かける
  # （両方とも、検査が黙って嘘をつく種類の不具合を実際に抱えていた）。
  scripts:
    name: Verification scripts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck scripts/*.sh

      # Write-Host はこのスクリプトの目的そのもの（端末への進捗表示）であり、ShouldProcess と
      # 単数形の名詞は公開コマンドレット向けの規約なので、この 3 つだけ除外する。
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $failed = $false
          foreach ($script in Get-ChildItem -Path scripts -Filter *.ps1 -Recurse) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Host "$($script.Name):$($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          $issues = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions, PSUseSingularNouns
          if ($issues) {
            $issues | Format-Table -AutoSize -Property Severity, ScriptName, Line, RuleName, Message | Out-String -Width 200 | Write-Host
            $failed = $true
          }
          if ($failed) { throw 'Verification scripts have findings' }

  site:
    name: Site CI
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Download site demos
        uses: actions/download-artifact@v8
        with:
          name: site-demos
          path: site/public

      - name: Install site dependencies
        run: npm ci

      - name: Audit site dependencies
        run: npm audit

      - name: Build production site
        run: npm run docs:build
