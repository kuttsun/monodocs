# Scheduled dependency updates.
#
# Security updates are enabled separately in the repository settings and are not
# affected by this file; these are the routine version bumps.
#
# The repository holds two independent dependency sets: the CLI / core workspace
# in app/ (pnpm) and the documentation site in site/ (npm). Minor and patch
# updates are grouped into one pull request per set to keep review cost low,
# while majors arrive individually because they need their own verification.
version: 2

updates:
  # Actions used by pr-ci, release, verify-published, and deploy-site.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # CLI / core workspace. Runtime dependencies here are bundled into the
  # published npm package, so PR CI must pass before any of these merge.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # pnpm refuses to install versions younger than `minimumReleaseAge` (24 hours by
    # default in pnpm 11) and checks the committed lockfile against it, so an update
    # proposed too early fails CI at install. Stay clear of that cutoff.
    cooldown:
      default-days: 3
    ignore:
      # @types/node describes the runtime the code is compiled against, and this package
      # supports the Node 22 line. Newer typings would let APIs missing from the oldest
      # supported Node pass typecheck. Revisit when the supported floor moves to a new major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      app:
        patterns: ['*']
        update-types: [minor, patch]

  # Documentation site. Never shipped to users.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    # npm enforces no release-age policy of its own here, but the same reasoning applies:
    # a freshly published version is the one most likely to be a compromised release.
    cooldown:
      default-days: 3
    groups:
      site:
        patterns: ['*']
        update-types: [minor, patch]
